name: Cloud Functions Test

# 보상·재화·출석·탈퇴를 처리하는 Cloud Functions의 테스트를 PR마다 실행한다 (#620)
# - rules-test.yml과 같은 구성 (별도 워크플로라 앱 빌드·규칙 테스트의 실패와 서로 영향 없음)
# - 경로 조건 없이 항상 실행: 나중에 "머지 필수 검사"로 지정해도 건너뛴 PR이 대기 상태로 막히지 않음
# - 머지 후(push)에도 실행: 합치면 깨지는 PR 조합을 잡고, develop·main에 캐시를 만들어 다른 PR도 재사용
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

permissions:
  contents: read

jobs:
  functions-test:
    runs-on: ubuntu-latest
    # node --test에는 기본 제한 시간이 없어, 테스트·에뮬레이터가 멈추면 GitHub 기본값(6시간)까지 붙잡힘
    # Windows PC에서 npm --prefix functions test 전체가 약 37초(1회 측정, 에뮬레이터 시작·종료 포함)라
    # rules-test.yml과 같은 10분이면 충분 (step이 아닌 job 단위라 설치 단계 멈춤도 포함)
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Firestore 에뮬레이터는 Java 21 이상 필요
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # functions/package.json의 engines(node 24)와 맞춘다. 다르면 함수 에뮬레이터가 경고를 띄운다
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # 프로젝트 ID가 demo-plant(에뮬레이터 전용)라 로그인·시크릿 불필요
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install -g firebase-tools@15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"

      # 에뮬레이터 jar를 매번 내려받지 않도록 캐시 (CLI 버전이 바뀌면 새로 받음)
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}

      - name: Install functions dependencies
        run: npm --prefix functions ci

      # 배포 전(predeploy)에 실행되는 lint를 PR에서 먼저 확인 (테스트 파일도 lint 대상)
      - name: Lint functions
        run: npm --prefix functions run lint

      # 에뮬레이터가 뜨지 않거나 테스트가 하나라도 실패하면 0이 아닌 코드로 끝나 job 실패
      # FUNCTIONS_DISCOVERY_TIMEOUT(초): 함수 에뮬레이터가 index.js를 불러와 함수 목록을 읽는 제한 시간.
      # 기본 10초라 러너가 바쁘면 함수가 하나도 등록되지 않고 테스트가 404·대기 시간 초과로 실패한다
      # (로컬에서 Gradle 빌드와 동시에 실행해 재현: 기본값은 실패, 60초는 통과)
      - name: Run Cloud Functions tests
        run: npm --prefix functions test
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 60

      # timeout-minutes 초과는 "취소(cancelled)"로 처리되어 failure()만으로는 실행되지 않음
      # → 멈춤(시간 초과)일 때가 로그가 가장 필요하므로 cancelled()도 포함
      - name: Upload emulator logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functions-test-logs
          path: functions/*.log
          if-no-files-found: ignore
